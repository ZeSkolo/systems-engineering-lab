services:
  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://search.example.com/}
      SEARXNG_LIMITER: "true"
    networks: [edge]
    expose:
      - "8080"

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [searxng]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge]

  # Optional Caddy alternative: docker compose --profile caddy up -d
  caddy:
    image: docker.io/library/caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [searxng]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
