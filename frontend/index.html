<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title id="page-title">Project UI</title><link rel="stylesheet" href="/frontend/styles.css"></head>
<body><a class="skip-link" href="#workspace">Skip to workspace</a><div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-mark">/ &gt;</span><span>Project workspace</span></div><div><div class="section-label">Your tools</div><nav id="navigation" aria-label="Project tools"></nav></div><div class="side-footer"><a id="repo-link" target="_blank" rel="noopener noreferrer">View repository ↗</a><p>Separate interface.<br>Original project underneath.</p></div></aside>
<main class="main"><header class="topbar"><div class="breadcrumb">ZeSkolo / <span id="repo-name"></span></div><div class="top-actions"><span id="connection" class="status" role="status">Connecting</span><button id="theme" class="icon-button" aria-label="Toggle color theme" title="Toggle color theme">◐</button></div></header>
<section class="hero"><span class="eyebrow">From code to output</span><h1 id="project-title"></h1><p id="intro"></p></section>
<div id="workspace" class="workspace"><section class="panel"><div class="panel-header"><h2 id="tool-title"></h2><p id="tool-description"></p></div><div id="actions" class="actions" aria-label="Actions"></div><form id="run-form"><div id="fields"></div><button id="run" class="primary" type="submit"><span id="run-label">Run</span><span aria-hidden="true">→</span></button><p id="form-note" class="form-note"></p><div id="error" class="error-box" role="alert" hidden></div></form></section>
<section class="panel" aria-label="Project output"><div class="panel-header output-heading"><div><h2>Output</h2><p>Results from your project</p></div><button id="download" type="button" class="secondary" disabled>Export JSON</button></div><div class="result-meta" aria-live="polite"><span id="result-message">Ready when you are</span><span id="elapsed"></span></div><div id="result" class="result"></div></section></div>
<footer class="bottom-note"><span aria-hidden="true">↳</span><span id="runtime-note"></span></footer></main></div><script src="/frontend/app.js"></script></body></html>
